kind = "web"
previewPath = "/"
title = "BrushPop"
version = "1.0.0"
id = "artifacts/brushpop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20037

[services.development]
run = "pnpm --filter @workspace/brushpop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brushpop", "run", "build" ]
publicDir = "artifacts/brushpop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20037"
BASE_PATH = "/"
